name: wayuunaiki_translator
description: "Traductor móvil de Español e Inglés a Wayuunaiki con diccionario verificado y Gemini IA."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/wayuunaiki_lexicon.json
